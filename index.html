                    philosophy: [{title: "어머니 사교육을 줄이셔야 합니다", author: "정승익", desc: "불안함에 휩쓸려 사교육에 의존하기보다, 아이의 공부 자존감을 지켜주는 부모의 단단한 철학을 세워주는 책입니다."}], 
                    practical: [
                        {title: "문해력 유치원", author: "최나야", desc: "모든 학습의 기초는 문해력입니다. 놀이처럼 시작하는 문해력 수업으로 공부 머리를 깨워주세요. 만 3세 이상 아이를 둔 부모님께 강력 추천합니다."},
                        {title: "보고 만지는 수학은 이렇게 가르칩니다", author: "최경희", desc: "수학을 공식이 아닌 놀이와 감각으로 깨치게 돕는 친절한 수학 가이드. 아이와의 일상 대화에서 어떻게 엄마와 놀이처럼 수학을 접하게 할 수 있을 지 많은 힌트를 얻을 수 있어요."},
                        {title: "말문이 트이는 영어 육아", author: "박정은", desc: "집에서 즐겁게 시작하는 영어. 영어가 어려운 엄마에게도 함께 공부가 되는 자연스러운 영어 노출 방법을 알려줘요."},
                        {title: "엄마표 다개국어", author: "이지나", desc: "건강한 언어 습관을 위한 완벽 가이드. 아이의 언어 감각을 깨워주는 실용적인 팁들이 가득합니다."}
                    ] 
                },
                method: { 
                    philosophy: [
                        {title: "흡수하는 정신", author: "마리아 몬테소리", desc: "아이의 무한한 잠재력을 믿는 몬테소리 철학. 교육의 근본적인 방향을 잡고 싶을 때 읽어보세요."},
                        {title: "부모라면 유대인처럼", author: "고재학", desc: "질문의 힘을 믿는 유대인 지혜. 교육의 근본적인 방향을 잡고 싶을 때 읽어보세요."}
                    ], 
                    practical: [
                        {title: "부모를 위한 몬테소리 교육법", author: "시모네 데이비스", desc: "몬테소리 교육의 실천법을 다룹니다. 실용적인 팁들이 가득합니다."},
                        {title: "몬테소리 육아 대백과", author: "팀 셀딘", desc: "아이의 잠재력을 깨우는 몬테소리 교육의 정수. 실천 가능한 가이드가 가득합니다."},
                        {title: "질문하는 공부법 하브루타", author: "전성수", desc: "질문과 대화가 끊이지 않는 유대인 부모의 지혜로 아이의 사고력을 키우는 공부법. 한국인들이 가장 어려워 하는 '질문하기'의 힘에 대해 이야기합니다."},
                        {title: "미국에서 더 유명한 0~5세 처음 영어", author: "장화정", desc: "실용적인 영어 노출과 자연스러운 습관 형성을 돕는 가이드입니다."}
                    ] 
                },
                read: { 
                    philosophy: [
                        {title: "책모임 이야기", author: "박미정", desc: "독서를 통해 아이와 정서적 유대를 쌓는 법을 다룹니다."},
                        {title: "푸름아빠의 몰입독서", author: "최희수", desc: "책육아의 본질은 엄마아빠와 많은 대화의 시간을 보내 내면의 힘을 기르는 것. 아이가 책의 바다에 빠지는 몰입의 순간을 만들어주는 독서 교육의 고전입니다. 책육아 관련 책 중 가장 추천하는 책!"}
                    ], 
                    practical: [
                        {title: "하버드에서 배운 최강의 책 육아", author: "가토 에이코", desc: "책 읽는 아이로 키우고 싶은 엄마들에게. 책 읽어 주는 방법에 대한 구체적인 예시들이 많아요!"},
                        {title: "골든타임 책육아", author: "남미영", desc: "0세~7세까지 아이의 시기별 책육아에 참고하기 좋아요! 특히 1~2세의 책육아 부분은 언어 발달, 특히 빨리 말이 트이는 방법에 좀 더 초점이 맞춰져 있어 언어발달에 관심있는 엄마들에게도 추천합니다."},
                        {title: "하루 1분 책 읽어주기의 힘", author: "짐 트렐리즈", desc: "단순한 독서를 넘어 아이와의 정서적 유대를 쌓는 가장 강력한 15분의 힘."}
                    ] 
                },
                sleep: { 
                    philosophy: [{title: "베이비 위스퍼 골드", author: "트레이시 호그", desc: "아기의 잠 매커니즘 이해를 돕는 제법 두꺼운 육아 바이블입니다."}], 
                    practical: [{title: "똑게육아", author: "김준희", desc: "수면 교육이 꼭 필요하다는 결론을 부모가 함께 내렸다면 추천합니다. 설이네도 고민 끝에 분리수면을 결정했고, 60일부터 이 책의 도움을 받았어요. '베이비 위스퍼 골드'와 같이 추천해요."}] 
                },
                eat: { 
                    philosophy: [{title: "아이주도 이유식", author: "질 래플리", desc: "식사 거부 고민을 덜어주는 마법 같은 방법! 아이가 스스로 먹는 즐거움을 깨닫고 건강한 식습관을 형성하도록 돕는 실전서입니다."}], 
                    practical: [{title: "아이주도 이유식 유아식 매뉴얼", author: "BLW연구소", desc: "건강한 식습관을 위한 완벽 가이드. 아이의 입맛을 잡아주는 실용적인 팁들이 가득합니다."}] 
                }
            }
        };

        const App = () => {
            const [step, setStep] = useState(0);
            const [answers, setAnswers] = useState({ category: '', tf: 50, energy: '', sub: '', tone: '' });
            const [result, setResult] = useState(null);

            const sliderBg = useMemo(() => {
                const ratio = answers.tf / 100;
                const r = Math.floor(254 - (254 - 239) * ratio);
                const g = Math.floor(226 + (242 - 226) * ratio);
                const b = Math.floor(226 + (254 - 226) * ratio);
                return `rgb(${r}, ${g}, ${b})`;
            }, [answers.tf]);

            const formatDesc = (text) => {
                if(!text) return "";
                const parts = text.split(/('.*?'|".*?"|!|\?)/g);
                return parts.map((part, i) => {
                    if (part.startsWith("'") || part.startsWith('"')) {
                        return <span key={i} className="highlight">{part}</span>;
                    }
                    return part;
                });
            };

            const calculateResult = (finalVal) => {
                const cur = { ...answers };
                let resBook;
                let descText;

                if (cur.category === 'group4') {
                    const bookList = bookDatabase.group4[cur.sub][finalVal]; 
                    resBook = bookList[Math.floor(Math.random() * bookList.length)];
                    descText = resBook.desc;
                } else {
                    const tfType = cur.tf >= 50 ? 'T' : 'F';
                    resBook = bookDatabase[cur.category][tfType][cur.energy];
                    descText = finalVal === 'soft' ? resBook.soft : resBook.pro;
                }
                setResult({ ...resBook, finalDesc: descText });
                setStep(10);
            };

            const shareToInsta = () => {
                alert("결과 화면을 캡쳐하여 인스타그램 스토리에 공유해보세요! 링크를 복사했습니다.");
                navigator.clipboard.writeText(window.location.href);
            };

            return (
                <div className="min-h-screen flex items-center justify-center p-4">
                    <div className="max-w-md w-full bg-white rounded-[40px] shadow-2xl overflow-hidden border-[8px] border-white relative flex flex-col min-h-[600px]">
                        
                        <div className="absolute bottom-6 right-8 text-[10px] text-stone-300 font-bold z-50 pointer-events-none">
                            [오늘, 설이네] @seol.today
                        </div>

                        {step > 0 && (
                            <div>
                                <div className="flex justify-between items-center px-8 py-6">
                                    <button 
                                        onClick={() => {
                                            if (step === 10) {
                                                setStep(answers.category === 'group4' ? 3 : 4);
                                            } else {
                                                setStep(step - 1);
                                            }
                                        }} 
                                        className="text-stone-400 text-sm font-bold flex items-center hover:text-orange-400"
                                    >
                                        <svg xmlns="http://www.w3.org/2000/svg" className="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth={3} d="M15 19l-7-7 7-7" /></svg> 이전
                                    </button>
                                    <span className="text-[10px] font-bold text-stone-300 tracking-widest uppercase italic">Mel's Prescription <span className="text-[8px] opacity-60 ml-1">v.Beta</span></span>
                                </div>
                                {step < 10 && (
                                    <div className="w-full h-1 bg-stone-50">
                                        <div className="h-full bg-orange-300 transition-all duration-700 rounded-r-full" style={{ width: `${(step / 4) * 100}%` }}></div>
                                    </div>
                                )}
                            </div>
                        )}

                        <div className="p-8 flex-1 flex flex-col justify-center text-center">
                            {step === 0 && (
                                <div className="fade-in">
                                    <div className="text-6xl mb-6">🧸</div>
                                    <h1 className="text-[24px] font-bold text-gray-800 mb-6 tracking-tight leading-tight">
                                        육아책 처방해드려요 <span className="beta-badge">BETA</span><br/>
                                        <span className="text-gray-400 font-normal text-lg">by 멜</span>
                                    </h1>
                                    <div className="text-[14px] text-gray-500 space-y-4 mb-10 leading-relaxed px-2 break-keep">
                                        <p>육아 휴직을 하며 읽은 책이 <br/>육아책만 50권 가까이 되더라구요.</p>
                                        <p>
                                            육아서 추천을 요청하시는 분들에게<br/> 
                                            각자의 상황과 성향을 고려해<br/> 
                                            추천하고 싶은 마음으로 만들어본<br/> 
                                            육아서 처방전입니다.
                                        </p>
                                        <p>대부분 육아서이고 추천하고 싶은 <br/>에세이나 소설도 가끔 나와요.</p>
                                        <p className="text-orange-400 font-bold">재미로 해보시고 후기 알려주세요 ❤️</p>
                                    </div>
                                    <button onClick={() => setStep(1)} className="w-full py-4 bg-orange-400 text-white rounded-full font-bold shadow-lg shadow-orange-100 hover:bg-orange-500 transition-all text-lg">시작하기</button>
                                </div>
                            )}

                            {step === 1 && (
                                <div className="fade-in text-left">
                                    <h2 className="text-[19px] font-bold text-gray-800 mb-8 leading-snug break-keep italic">"요즘 머릿속을 떠나지 않는 생각이 무엇인가요?"</h2>
                                    <div className="space-y-4">
                                        {[
                                            {id:'group1', t:"끝없이 반복되는 육아의 굴레가 두렵다", k:"#번아웃 #자존감"},
                                            {id:'group2', t:"우리 애 잘 크고 있는지 잘 모르겠어", k:"#발달확인 #기질이해"},
                                            {id:'group3', t:"나는 왜 자꾸 애한테 화가 날까 ㅠㅠ", k:"#감정조절 #훈육기준"},
                                            {id:'group4', t:"SNS 속 과다한 육아정보에 지쳤어. 책으로 깊이있게 알고싶어", k:"#학습 #수면 #이유식"}
                                        ].map(item => (
                                            <button key={item.id} onClick={() => { setAnswers({...answers, category: item.id}); setStep(2); }} 
                                                className="w-full p-5 text-left border-[1.5px] border-stone-100 rounded-[20px] hover:border-orange-200 transition-all group">
                                                <p className="font-bold text-gray-700 group-hover:text-orange-500 text-[15px] break-keep mb-1">"{item.t}"</p>
                                                <p className="text-[11px] text-stone-300 font-medium">{item.k}</p>
                                            </button>
                                        ))}
                                    </div>
                                </div>
                            )}

                            {step === 2 && (
                                <div className="fade-in text-left">
                                    {answers.category === 'group4' ? (
                                        <>
                                            <h2 className="text-[20px] font-bold text-gray-800 mb-8 leading-snug">요즘 가장 신경쓰는 부분은 무엇인가요?</h2>
                                            <div className="space-y-3">
                                                {[{id:'study', t:'놀이 / 학습'}, {id:'method', t:'교육법'}, {id:'read', t:'책육아'}, {id:'sleep', t:'수면'}, {id:'eat', t:'식사'}].map(item => (
                                                    <button key={item.id} onClick={() => { setAnswers({...answers, sub: item.id}); setStep(3); }} className="w-full p-4 border-[1.5px] border-stone-100 rounded-[15px] font-bold text-gray-600 hover:border-orange-200">{item.t}</button>
                                                ))}
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <h2 className="text-[20px] font-bold text-gray-800 mb-6 leading-snug">육아 고민을 나눌 때,<br/>어떤 조언이 더 힘이 되나요?</h2>
                                            <div className="px-6 py-14 rounded-[35px] mb-8 mt-4 relative transition-colors duration-500" style={{ backgroundColor: sliderBg }}>
                                                <input 
                                                    type="range" 
                                                    min="0" max="100" 
                                                    value={answers.tf} 
                                                    onChange={(e) => setAnswers({...answers, tf: parseInt(e.target.value)})} 
                                                    className="w-full" 
                                                />
                                                <div className="flex justify-between mt-8 px-1 text-[12px] font-bold">
                                                    <div className="flex flex-col items-center">
                                                        <span className={`text-2xl mb-2 transition-transform ${answers.tf < 50 ? 'scale-125' : 'opacity-40'}`}>🧸</span>
                                                        <span className={answers.tf < 50 ? "text-orange-600" : "text-stone-400"}>따뜻한 위로</span>
                                                    </div>
                                                    <div className="flex flex-col items-center">
                                                        <span className={`text-2xl mb-2 transition-transform ${answers.tf >= 50 ? 'scale-125' : 'opacity-40'}`}>💡</span>
                                                        <span className={answers.tf >= 50 ? "text-blue-600" : "text-stone-400"}>명쾌한 해결</span>
                                                    </div>
                                                </div>
                                            </div>
                                            <button onClick={() => setStep(3)} className="w-full py-4 bg-orange-400 text-white rounded-full font-bold shadow-lg text-lg">다음으로</button>
                                        </>
                                    )}
                                </div>
                            )}

                            {step === 3 && (
                                <div className="fade-in text-left">
                                    {answers.category === 'group4' ? (
                                        <>
                                            <h2 className="text-[20px] font-bold text-gray-800 mb-10 leading-snug break-keep italic">어떤 책을 찾고 있나요?</h2>
                                            <div className="space-y-4">
                                                <button onClick={() => calculateResult('practical')} className="w-full p-6 text-left border-[1.5px] border-stone-100 rounded-[25px] font-bold text-gray-600 hover:border-orange-200 transition-all leading-snug group">
                                                    <span className="block group-hover:text-orange-500">1. 당장 따라할 수 있는 실용적인 책</span>
                                                </button>
                                                <button onClick={() => calculateResult('philosophy')} className="w-full p-6 text-left border-[1.5px] border-stone-100 rounded-[25px] font-bold text-gray-600 hover:border-orange-200 transition-all leading-snug group">
                                                    <span className="block group-hover:text-orange-500">2. 본질을 꿰뚫는 통찰로 중심을 잡아주는 책</span>
                                                </button>
                                            </div>
                                        </>
                                    ) : (
                                        <>
                                            <h2 className="text-[20px] font-bold text-gray-800 mb-10 leading-snug">현재 엄마의 에너지 상태는 어떤가요?</h2>
                                            <div className="space-y-4">
                                                {[{id:'light', t:'지쳐있어요. 가볍게 읽고 싶어요'}, {id:'normal', t:'보통이에요'}, {id:'hard', t:'의욕이 넘쳐요!'}].map(item => (
                                                    <button key={item.id} onClick={() => { setAnswers({...answers, energy: item.id}); setStep(4); }} className="w-full p-5 text-left border-[1.5px] border-stone-100 rounded-[20px] font-bold text-gray-600 hover:border-orange-200">{item.t}</button>
                                                ))}
                                            </div>
                                        </>
                                    )}
                                </div>
                            )}

                            {step === 4 && (
                                <div className="fade-in text-left">
                                    <h2 className="text-[20px] font-bold text-gray-800 mb-10 leading-snug">어떤 말투의 처방전을 선호하시나요?</h2>
                                    <div className="space-y-4">
                                        <button onClick={() => calculateResult('soft')} className="w-full p-6 text-left border-[1.5px] border-stone-100 rounded-[25px] font-bold text-gray-600 hover:border-orange-200">공감과 위로의 처방전</button>
                                        <button onClick={() => calculateResult('pro')} className="w-full p-6 text-left border-[1.5px] border-stone-100 rounded-[25px] font-bold text-gray-600 hover:border-orange-200">담백 따끔 처방전</button>
                                    </div>
                                </div>
                            )}

                            {step === 10 && result && (
                                <div className="fade-in">
                                    <div className="text-5xl mb-6">🌿</div>
                                    <h2 className="text-orange-400 font-bold text-[10px] tracking-[0.2em] mb-3 uppercase">Special Prescription</h2>
                                    <h1 className="text-[20px] font-bold text-gray-800 mb-6 italic leading-tight">『{result.title}』 <span className="text-stone-400 text-xs font-normal not-italic ml-1">저자 {result.author}</span></h1>
                                    <div className="bg-[#fff9f5] p-6 rounded-[30px] mb-6 text-left border border-orange-100 shadow-inner">
                                        <p className="text-gray-600 leading-relaxed font-medium text-[15px] break-keep">
                                            {formatDesc(result.finalDesc)}
                                        </p>
                                    </div>
                                    
                                    <div className="grid grid-cols-2 gap-3 mb-3">
                                        <button onClick={shareToInsta} className="py-4 bg-pink-50 text-pink-500 rounded-full font-bold text-sm border border-pink-100 flex items-center justify-center">
                                            📸 SNS 공유
                                        </button>
                                        <button onClick={() => alert('곧 링크가 연결됩니다!')} className="py-4 bg-orange-50 text-orange-500 rounded-full font-bold text-sm border border-orange-100">
                                            🛒 도서 구매
                                        </button>
                                    </div>
                                    <button onClick={() => window.location.reload()} className="w-full py-4 bg-orange-400 text-white rounded-full font-bold shadow-lg hover:bg-orange-500 transition-all text-lg mb-4">다시 하기</button>
                                </div>
                            )}
                        </div>
                    </div>
                </div>
            );
        }; 

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
